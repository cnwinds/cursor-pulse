dingtalk:
  app_key: ${DINGTALK_APP_KEY}
  app_secret: ${DINGTALK_APP_SECRET}
  robot_code: ${DINGTALK_ROBOT_CODE}
  group_open_conversation_id: ${DINGTALK_GROUP_ID}

feishu:
  app_id: ${FEISHU_APP_ID}
  app_secret: ${FEISHU_APP_SECRET}
  bot_open_id: ${FEISHU_BOT_OPEN_ID}
  group_chat_id: ${FEISHU_GROUP_CHAT_ID}

collection:
  period_format: "%Y-%m"
  timezone: "Asia/Shanghai"

cursor_sync:
  enabled: true
  tick_interval_minutes: 2
  batch_size: 3
  pre_publish_batch_size: 5
  default_interval_minutes: 1440
  month_close_interval_minutes: 360
  max_retry_count: 8
  pre_publish_start_time: "08:00"
  enforce_on_demand_disabled: true
  on_demand_notify_primary: true
  on_demand_notify_admins_on_api_failure: true

storage:
  database_url: "sqlite:///data/pulse.db"
  raw_files_dir: "data/raw"

admin:
  channel_user_ids: []

bot:
  name: none

object_storage:
  enabled: false
  endpoint_url: ""
  bucket: ""
  prefix: "pulse/raw"

cursor_teams:
  enabled: false
  api_base_url: "https://api.cursor.com"

web:
  host: "127.0.0.1"
  port: 8080

tenant:
  slug: "default"
  name: "Default Team"

tool_center:
  loan_selection:
    max_active_loans_per_account: 2
    min_coverage_hours: 1
    freshness_full_penalty_hours: 24
    weight_urgency: 0.50
    weight_surplus: 0.25
    weight_load: 0.15
    weight_freshness: 0.10
