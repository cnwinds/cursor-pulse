[project]
name = "cursor-pulse"
version = "0.5.0"
description = "Self-hosted Cursor usage metering and quota control plane (IM channels optional)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "xiongbo" }]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "cryptography>=42.0",
    "chinese-calendar>=1.9",
    # usage.query natural-language usage tables
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/cnwinds/cursor-pulse"
Repository = "https://github.com/cnwinds/cursor-pulse"
Issues = "https://github.com/cnwinds/cursor-pulse/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "httpx>=0.27",
    "cursor-pulse[dingtalk,feishu,web]",
]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "PyJWT>=2.8"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
# Stream transport for DingTalkRuntime (see pulse/channels/dingtalk/).
dingtalk = ["dingtalk-stream>=0.24"]
# WebSocket long-connection transport for FeishuRuntime (see pulse/channels/feishu/runtime.py).
feishu = ["lark-oapi>=1.4"]
all = ["cursor-pulse[dev,web,postgres,s3,feishu,dingtalk]"]

[project.scripts]
pulse = "pulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*", "assistant_platform*"]

# Vue admin build output (see web-admin/vite.config.ts → pulse/web/static)
[tool.setuptools.package-data]
pulse = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["pulse", "assistant_platform", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",  # line length: adopt gradually; formatter wraps where safe
    "E402",  # lazy imports (FastAPI routes, optional deps, side-effect ORM registration)
    "UP042",  # str+Enum → StrEnum: mechanical; migrate in a dedicated pass
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]  # re-export / optional import probes in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
